# Frontier: Syndicate Uplink Modchip — use on a PDA to add traitor syndicate uplink (ringtone + store), same as SS14.
- type: entity
  parent: BaseItem
  id: SyndicateUplinkModchip
  name: syndicate-uplink-modchip-name
  description: syndicate-uplink-modchip-description
  components:
    - type: Sprite
      sprite: Objects/Devices/encryption_keys.rsi
      layers:
        - state: crypt_red
        - state: synd_label
    - type: Icon
      sprite: Objects/Devices/encryption_keys.rsi
      state: synd_label
    - type: Item
      size: Small
    - type: SyndicateUplinkModchip
      balance: 0
      giveDiscounts: false
      useSound:
        collection: sparks
